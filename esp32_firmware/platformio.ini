; PlatformIO Project Configuration File for Smart Plant Care V3.1 (ESP32 I2C 20x4 Edition)
; Compatible with both PlatformIO (`pio run`) and Arduino IDE (open SmartPlantCare/SmartPlantCare.ino)

[platformio]
src_dir = SmartPlantCare

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  duinoWitchery/hd44780 @ ^1.3.2
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  bblanchon/ArduinoJson @ ^7.2.0
